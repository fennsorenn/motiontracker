[project]
name = "mtcore"
version = "0.0.0"
description = "Shared motiontracker code: MHR loading, CMU reader + fit, MHR -> VRM 1.0 conversion"
requires-python = ">=3.12,<3.13"
# torch comes from the consumer project (CPU for spikes, CUDA for train/)
dependencies = ["pymomentum-cpu", "torch", "numpy"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
