[project]
name = "mteval"
version = "0.1.0"
description = "Evaluation harness: run tracking systems over recorded sessions and compute jitter, lag and accuracy metrics."
authors = [
    { name = "Fenn Sorenn", email = "fenn.sorenn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
mteval = "mteval.cli:main"
